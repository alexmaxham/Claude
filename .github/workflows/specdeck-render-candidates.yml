name: SpecAtlas render candidates

# One-off: collects large images from official press and product pages into specdeck/render-candidates/
# on this branch, for picking front-facing press renders by eye. Removed once the renders are chosen.
on:
  push:
    branches: [claude/dazzling-hopper-bw85bw]
    paths: ['specdeck/scripts/find-press-renders.mjs', '.github/workflows/specdeck-render-candidates.yml']

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specdeck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: specdeck/package-lock.json
      - run: npm ci
      - run: node scripts/find-press-renders.mjs
      - name: Commit candidates
        run: |
          git config user.name "specdeck-admin[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-candidates
          git diff --cached --quiet && exit 0
          git commit -m "SpecAtlas: press render candidates for review"
          git pull --rebase && git push

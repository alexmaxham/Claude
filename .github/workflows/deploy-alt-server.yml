name: Deploy alt text server

# Publishes image-resizer/server/ (a Cloudflare Worker) and sets its two secrets.
# Does nothing until the four repository secrets below exist. Setup: image-resizer/server/README.md
on:
  push:
    branches: [main, claude/gamified-todo-app-wc0pod]
    paths:
      - image-resizer/server/**
      - .github/workflows/deploy-alt-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alt-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-resizer/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALLOWED_EMAILS: ${{ secrets.ALT_ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@v5
      - id: ready
        name: Check the secrets are in place
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$ALLOWED_EMAILS" ] || missing="$missing ALT_ALLOWED_EMAILS"
          if [ -n "$missing" ]; then
            echo "::notice::Alt text server not deployed. Missing repository secrets:$missing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: image-resizer/server/package-lock.json
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        run: npm test
      - if: steps.ready.outputs.go == 'true'
        name: Deploy the server
        run: npx wrangler deploy
      - if: steps.ready.outputs.go == 'true'
        name: Set the server's secrets
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$ALLOWED_EMAILS" | npx wrangler secret put ALLOWED_EMAILS

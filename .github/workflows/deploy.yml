name: Deploy to GitHub Pages

# Publishes the AH tools in tools/ (plain static files) at https://alexmaxham.github.io/Claude/:
# the Image Resizer at the root, the Screenshot Framer at /screenshot-framer/ and Photo Compare at /photo-compare/.
on:
  push:
    branches: [main, claude/gamified-todo-app-wc0pod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the scripts parse
        run: |
          for file in tools/*.js tools/screenshot-framer/*.js tools/photo-compare/*.js; do node --check "$file"; done
      - name: Assemble the site
        run: |
          mkdir -p _site/image-resizer
          cd tools
          cp -r index.html styles.css app.js zip.js meta.js alt-text.js assets.js assets screenshot-framer photo-compare ../_site/
          # The resizer first lived at /Claude/image-resizer/; send that old link to the new home.
          cp moved.html ../_site/image-resizer/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

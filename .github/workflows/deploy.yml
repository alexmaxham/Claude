name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/gamified-todo-app-wc0pod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The dividend tracker ships alongside as a static demo at /dividends/ (Robinhood sync needs its own server).
      - run: npm ci && npx tsc -b && npx vite build --outDir ../dist/dividends --emptyOutDir
        working-directory: dividends
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

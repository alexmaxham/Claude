name: Deploy to GitHub Pages

# Publishes the AH Image Resizer (image-resizer/, plain static files) at https://alexmaxham.github.io/Claude/.
on:
  push:
    branches: [main, claude/gamified-todo-app-wc0pod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the scripts parse
        run: |
          node --check image-resizer/app.js
          node --check image-resizer/zip.js
          node --check image-resizer/assets.js
      - name: Assemble the site
        run: |
          mkdir -p _site/image-resizer
          cd image-resizer
          cp -r index.html styles.css app.js zip.js assets.js assets ../_site/
          # The tool first lived at /Claude/image-resizer/; send that old link to the new home.
          cp moved.html ../_site/image-resizer/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

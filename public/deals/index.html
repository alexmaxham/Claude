<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="The latest tech and electronics deals, from Slickdeals." />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B7%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <title>Tech Deals</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #15171c;
        --muted: #6a6f7a;
        --line: #e3e5ea;
        --accent: #2563eb;
        --accent-text: #ffffff;
        --price: #0f7b3f;
        --chip: #e9ebef;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111317;
          --card: #1b1e24;
          --text: #eef0f3;
          --muted: #9aa0ab;
          --line: #2c3038;
          --accent: #4b82f5;
          --price: #4ade80;
          --chip: #262a31;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
      }
      header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
      .controls {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 0 10px;
        background: var(--bg);
      }
      input[type='search'], select {
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
      }
      input[type='search'] { flex: 1 1 220px; min-width: 0; }
      .stores { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
      .stores button {
        flex: none;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--chip);
        border: 0;
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .stores button[aria-pressed='true'] { background: var(--accent); color: var(--accent-text); }
      .grid {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
      }
      .deal {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        height: 100%;
        transition: border-color 0.15s, transform 0.15s;
      }
      .deal:hover { border-color: var(--accent); }
      .deal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (prefers-reduced-motion: no-preference) { .deal:hover { transform: translateY(-2px); } }
      .thumb {
        aspect-ratio: 4 / 3;
        background: #fff;
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--line);
      }
      .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
      .thumb span { font-size: 40px; }
      .thumb.none { background: var(--chip); }
      @media (max-width: 560px) {
        .grid { grid-template-columns: 1fr; gap: 10px; }
        .deal { flex-direction: row; }
        .thumb { flex: none; width: 104px; aspect-ratio: 1; border-bottom: 0; border-right: 1px solid var(--line); }
        .thumb img { padding: 8px; }
        .thumb span { font-size: 28px; }
        .body { padding: 10px 12px; gap: 6px; }
        .price { font-size: 17px; }
      }
      .body { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; flex: 1; }
      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta { margin-top: auto; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .price { font-size: 19px; font-weight: 700; color: var(--price); }
      .store { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 2px 7px; }
      .sub { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
      .empty { text-align: center; color: var(--muted); padding: 60px 16px; }
      footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tech Deals</h1>
        <p id="status">Loading the latest deals…</p>
      </header>
      <div class="controls">
        <input type="search" id="q" placeholder="Search deals" aria-label="Search deals" />
        <select id="sort" aria-label="Sort deals">
          <option value="new">Newest</option>
          <option value="thumbs">Most thumbs up</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>
      <div class="stores" id="stores" role="group" aria-label="Filter by store"></div>
      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty" hidden></p>
      <footer>
        Deals and prices from <a href="https://slickdeals.net/deals/tech/" rel="noopener">Slickdeals</a>.
        Prices change quickly; check the store before you buy.
      </footer>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const money = (n) =>
        n.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: n % 1 ? 2 : 0 });
      let deals = [];
      let store = '';

      function ago(iso) {
        const mins = Math.round((Date.now() - new Date(iso)) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' min ago';
        if (mins < 1440) return Math.round(mins / 60) + ' h ago';
        return Math.round(mins / 1440) + ' d ago';
      }

      function el(tag, props, children) {
        const node = Object.assign(document.createElement(tag), props);
        for (const c of children || []) if (c) node.append(c);
        return node;
      }

      function card(d) {
        const img = d.image
          ? el('img', { src: d.image, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' })
          : el('span', { textContent: '🏷️' });
        const thumb = el('div', { className: d.image ? 'thumb' : 'thumb none' }, [img]);
        if (d.image) img.onerror = () => { thumb.className = 'thumb none'; img.replaceWith(el('span', { textContent: '🏷️' })); };
        return el('li', {}, [
          el('a', { className: 'deal', href: d.link, target: '_blank', rel: 'noopener' }, [
            thumb,
            el('div', { className: 'body' }, [
              el('p', { className: 'title', textContent: d.title }),
              el('div', { className: 'meta' }, [
                d.price != null && el('span', { className: 'price', textContent: money(d.price) }),
                d.store && el('span', { className: 'store', textContent: d.store }),
              ]),
              el('div', { className: 'sub' }, [
                el('span', { textContent: d.published ? ago(d.published) : '' }),
                el('span', { textContent: d.thumbs != null ? '👍 ' + d.thumbs : '' }),
              ]),
            ]),
          ]),
        ]);
      }

      function render() {
        const q = $('q').value.trim().toLowerCase();
        const sort = $('sort').value;
        const shown = deals.filter((d) => (!store || d.store === store) && (!q || d.title.toLowerCase().includes(q)));
        const by = {
          new: (a, b) => (b.published || '').localeCompare(a.published || ''),
          thumbs: (a, b) => (b.thumbs ?? -1) - (a.thumbs ?? -1),
          low: (a, b) => (a.price ?? Infinity) - (b.price ?? Infinity),
          high: (a, b) => (b.price ?? -Infinity) - (a.price ?? -Infinity),
        }[sort];
        $('grid').replaceChildren(...shown.sort(by).map(card));
        $('empty').hidden = shown.length > 0;
        $('empty').textContent = deals.length ? 'No deals match.' : 'No deals right now. Check back soon.';
      }

      function renderStores() {
        const counts = {};
        for (const d of deals) if (d.store) counts[d.store] = (counts[d.store] || 0) + 1;
        const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 12);
        const chip = (name, label) => {
          const b = el('button', { type: 'button', textContent: label });
          b.setAttribute('aria-pressed', String(store === name));
          b.onclick = () => { store = name; renderStores(); render(); };
          return b;
        };
        $('stores').replaceChildren(chip('', 'All stores'), ...names.map((n) => chip(n, n)));
      }

      $('q').addEventListener('input', render);
      $('sort').addEventListener('change', render);

      fetch('deals.json', { cache: 'no-cache' })
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((data) => {
          deals = Array.isArray(data.deals) ? data.deals : [];
          $('status').textContent = data.fetchedAt
            ? deals.length + ' deals · updated ' + ago(data.fetchedAt)
            : 'Deals are on their way.';
        })
        .catch(() => { $('status').textContent = "Couldn't load deals. Try again in a moment."; })
        .finally(() => { renderStores(); render(); });
    </script>
  </body>
</html>

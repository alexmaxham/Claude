<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tasko: a gamified to-do list. Earn XP, keep streaks, level up." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tasko" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sora, for the "tasko" wordmark only. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tasko</title>
    <script>
      // Pick light or dark before first paint so there's no flash; src/appearance.ts takes over after.
      (function () {
        var a = 'system';
        try { a = JSON.parse(localStorage.getItem('questlog:prefs') || '{}').appearance || 'system'; } catch (e) {}
        var light = a === 'light' || (a === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.scheme = light ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
